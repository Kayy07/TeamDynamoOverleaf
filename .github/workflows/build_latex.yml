
name: Build Senior Design Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate build information
        run: |
          echo '\newcommand{\CommitHash}{'$(git rev-parse --short HEAD)'}' > 2026F_SSW423_Group_01_Dynamo/buildinfo.tex
          echo '\newcommand{\BuildNumber}{${{ github.run_number }}}' >> 2026F_SSW423_Group_01_Dynamo/buildinfo.tex

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: 2026F_SSW423_Group_01_Dynamo/SeniorDesignReportTemplate.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -interaction=nonstopmode -file-line-error

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: Senior-Design-Report
          path: 2026F_SSW423_Group_01_Dynamo/SeniorDesignReportTemplate.pdf
